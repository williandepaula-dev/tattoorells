<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TattooReels Studio AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0b0f; color: #f3f4f6; padding: 14px; max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
    .top { display: flex; justify-content: space-between; align-items: center; background: #15151d; padding: 12px 14px; border-radius: 14px; border: 1px solid #262635; margin-bottom: 14px; }
    .top h1 { font-size: 15px; font-weight: 800; letter-spacing: 0.4px; }
    .badge { font-size: 10px; font-weight: 700; color: #fbbf24; background: rgba(251, 191, 36, 0.12); border: 1px solid rgba(251, 191, 36, 0.35); padding: 4px 8px; border-radius: 99px; }
    .preview-box { background: #15151d; border: 1px solid #262635; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; }
    canvas { width: 205px; height: 364px; background: #050507; border-radius: 14px; border: 2px solid #2d2d3d; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
    .preview-controls { display: flex; gap: 8px; margin-top: 10px; width: 205px; }
    .card { background: #15151d; border: 1px solid #262635; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .card h2 { font-size: 12px; text-transform: uppercase; color: #9ca3af; letter-spacing: 0.6px; margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #d1d5db; margin-bottom: 5px; margin-top: 10px; }
    label:first-of-type { margin-top: 0; }
    input[type="text"], input[type="password"], select, textarea { width: 100%; background: #0b0b0f; border: 1px solid #2e2e3e; color: #fff; padding: 11px 12px; border-radius: 10px; font-size: 14px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #e11d48; }
    textarea { resize: vertical; min-height: 95px; font-size: 13px; line-height: 1.4; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
    .btn:active { opacity: 0.8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-pink { background: #e11d48; }
    .btn-blue { background: #2563eb; margin-top: 8px; }
    .btn-green { background: #16a34a; font-size: 15px; padding: 14px; }
    .btn-purple { background: #7c3aed; }
    .btn-recording { background: #dc2626; animation: pulse 1.2s infinite; }
    .btn-dark { background: #262635; font-size: 12px; padding: 8px 10px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .clip-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .clip-item { display: flex; justify-content: space-between; align-items: center; background: #0b0b0f; border: 1px solid #262635; padding: 8px 10px; border-radius: 8px; font-size: 12px; }
    .clip-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
    .clip-actions { display: flex; gap: 4px; }
    .mini-btn { background: #262635; border: none; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .status { text-align: center; font-size: 12px; color: #fbbf24; margin-top: 8px; line-height: 1.4; }
    .status-ok { color: #4ade80; }
    .hidden { display: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }
  </style>
</head>
<body>

  <div class="top">
    <h1>💉 TATTOOREELS STUDIO</h1>
    <span class="badge">9:16 • GUARULHOS</span>
  </div>

  <div class="preview-box">
    <canvas id="canvas" width="540" height="960"></canvas>
    <div class="preview-controls">
      <button type="button" class="btn btn-dark" id="btnPreview">▶ Testar Prévia</button>
    </div>
  </div>

  <!-- 1. VÍDEOS E BEAT -->
  <div class="card">
    <h2>1. Vídeos da Galeria (Resultado Final por Último)</h2>
    <input type="file" id="videoInput" accept="video/*" multiple class="hidden">
    <button type="button" class="btn btn-pink" onclick="document.getElementById('videoInput').click()">+ Selecionar Vídeos da Galeria</button>
    <div id="clipList" class="clip-list"></div>

    <input type="file" id="audioInput" accept="audio/*" class="hidden">
    <button type="button" class="btn btn-blue" onclick="document.getElementById('audioInput').click()">🎵 Adicionar Beat / Música (Opcional)</button>
    <div id="audioInfo" class="status hidden"></div>
  </div>

  <!-- 2. IA GROQ (MICROFONE + LEGENDAS) -->
  <div class="card">
    <h2>2. IA de Voz e Legendas (Groq)</h2>
    <label>Sua API Key da Groq (salva só no seu celular):</label>
    <div class="row">
      <input type="password" id="groqKey" placeholder="Cole sua chave gsk_...">
      <button type="button" class="btn btn-dark" style="width: auto; padding: 11px 14px;" id="btnSaveKey">Salvar</button>
    </div>
    <div id="keyStatus" class="status"></div>

    <label>Fale sobre a tattoo (estilo, local, sessão):</label>
    <button type="button" class="btn btn-purple" id="btnMic">🎙️ Tocar para Falar (Gerar Gancho + Legenda)</button>
    <div id="aiStatus" class="status"></div>

    <div id="captionBox" class="hidden" style="margin-top: 10px;">
      <label>Legenda Pronta para o Instagram:</label>
      <textarea id="captionOutput"></textarea>
      <button type="button" class="btn btn-dark" style="margin-top: 6px;" id="btnCopyCaption">📋 Copiar Legenda</button>
    </div>
  </div>

  <!-- 3. RITMO E TEXTOS -->
  <div class="card">
    <h2>3. Ritmo e Textos de Conversão</h2>
    <label>Velocidade dos Cortes:</label>
    <select id="cutSpeed">
      <option value="1.85">🔥 Reels Viral 130 BPM (Cortes 1.85s)</option>
      <option value="1.20">⚡ Mandelão / Automotivo Rápido (Cortes 1.20s)</option>
      <option value="2.80">🎨 Realismo Black &amp; Grey Detalhado (Cortes 2.80s)</option>
    </select>

    <label>Gancho no Topo (Prende atenção nos 2s iniciais):</label>
    <input type="text" id="hookText" value="FECHAMENTO FEITO EM GUARULHOS 🔥">

    <label>Botão Verde do WhatsApp:</label>
    <input type="text" id="ctaText" value="📲 ORÇAMENTO NO WHATSAPP">

    <label>Localização / Chamada:</label>
    <input type="text" id="locText" value="GUARULHOS - SP • AGENDA ABERTA">

    <label>Seu @ do Instagram:</label>
    <input type="text" id="instaText" value="@williandepaulatattoo">
  </div>

  <button type="button" class="btn btn-green" id="btnRender">🚀 GERAR E BAIXAR VÍDEO PRONTO</button>
  <div id="renderStatus" class="status">Pronto! Adicione seus vídeos acima para começar.</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let clips = [];
    let audioFile = null;
    let isPlayingPreview = false;
    let previewAnimId = null;

    // --- CARREGAR E SALVAR API KEY GROQ ---
    const groqKeyInput = document.getElementById('groqKey');
    const keyStatus = document.getElementById('keyStatus');
    const savedKey = localStorage.getItem('groq_api_key');
    if (savedKey) {
      groqKeyInput.value = savedKey;
      keyStatus.textContent = '✅ Chave Groq salva e pronta!';
      keyStatus.className = 'status status-ok';
    }

    document.getElementById('btnSaveKey').addEventListener('click', () => {
      const val = groqKeyInput.value.trim();
      if (!val) {
        localStorage.removeItem('groq_api_key');
        keyStatus.textContent = 'Chave removida.';
        keyStatus.className = 'status';
        return;
      }
      localStorage.setItem('groq_api_key', val);
      keyStatus.textContent = '✅ Chave Groq salva com sucesso!';
      keyStatus.className = 'status status-ok';
    });

    let audioChunks = [];
    let isRecording = false;

    const aiStatus = document.getElementById('aiStatus');

      const apiKey = groqKeyInput.value.trim();
      if (!apiKey) {
        aiStatus.textContent = '⚠️ Cole e salve sua API Key da Groq acima primeiro.';
        return;
      }

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            await processVoiceWithGroq(audioBlob, apiKey);
          };
          mediaRecorder.start();
          isRecording = true;
          btnMic.textContent = '⏹️ Gravando... Toque para Finalizar';
          btnMic.className = 'btn btn-recording';
          aiStatus.textContent = '🎙️ Fale agora sobre a tattoo...';
        } catch (err) {
          aiStatus.textContent = '❌ Permissão de microfone negada. Libere no cadeado do navegador.';
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btnMic.textContent = '🎙️ Tocar para Falar (Gerar Gancho + Legenda)';
        btnMic.className = 'btn btn-purple';
        aiStatus.textContent = '⏳ Transcrevendo sua voz...';
      }
    });
